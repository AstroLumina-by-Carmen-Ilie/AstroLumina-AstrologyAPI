services:
  astrology:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-astrologyapi:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3031:3031"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3031/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.125'
          memory: 128M
    networks:
      - astrology-api

networks:
  astrology-api:
    name: astrology-api-network
    driver: bridge
