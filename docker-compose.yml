services:
  astrology-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrolumina-astrology-api
    restart: unless-stopped
    expose:
      - "3031"
    ports:
      - "3031:3031"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3031}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3031/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  default:
    name: astrolumina-astrology-network